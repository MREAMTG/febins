services:
    #########
    # GCC #
    #########
    gcc-ubuntu-focal-amd64:
        build:
            context: .
            dockerfile: ./docker/gcc.Dockerfile
            args:
                - BUILD_IMAGE=ubuntu:focal
                - PLATFORM=linux/amd64
                - GCC_VERSION=16.1.0
                - GDB_VERSION=17.1
                - PYTHON_VERSION=3.12.13
                - VALGRIND_VERSION=3.27.0
                - DOXYGEN_VERSION=1.17.0
                - CMAKE_VERSION=3.31.12
                - LLVM_VERSION=22
                - UID=1000
                - GID=1000
                - TZ=America/Toronto
        platform: linux/amd64
        volumes:
            - ./out:/out
        command: ["/bin/sh", "-c", "cp -a /home/factoryengine/out/. /out"]

